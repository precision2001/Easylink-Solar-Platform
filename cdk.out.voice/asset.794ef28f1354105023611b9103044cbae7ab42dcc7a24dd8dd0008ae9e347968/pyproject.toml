[project]
name = "easylink-voice"
version = "0.1.0"
description = "EasyLink Solar phone agent (LiveKit + Deepgram + Claude on Bedrock)"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[deepgram,silero,aws]~=1.8",
  "livekit-api~=1.2",
  "httpx>=0.27",
  "boto3>=1.35",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["easylink_voice*"]
