# Test, then deploy the AI platform and the phone agent to AWS Sydney.
# Runs only when started by hand (Actions → Deploy → Run workflow).
#
# One-time setup in AWS: an IAM role GitHub can assume (OIDC), trusted for this repo,
# allowed to run CDK (the CDK bootstrap roles). Save its ARN as the repo secret AWS_DEPLOY_ROLE_ARN.
# See docs/VOICE_AGENT.md.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      voice_tasks:
        description: "Phone agent tasks to run (0 until the LiveKit, Deepgram and egress secrets are filled in)"
        default: "0"
        required: true
      stacks:
        description: "Stacks"
        default: "EasyLinkAi EasyLinkVoice"
        required: true

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./voice-agent "pytest>=8" "pytest-asyncio>=0.24"
      - run: python -m pytest
        working-directory: voice-agent

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm   # builds the arm64 agent image natively
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Deploy
        run: >
          npx cdk deploy ${{ inputs.stacks }}
          --require-approval never
          -c voiceTasks=${{ inputs.voice_tasks }}
          -c backendApiBaseUrl=${{ vars.BACKEND_API_BASE_URL }}
          -c filesBucket=${{ vars.FILES_BUCKET }}
          -c modelFastId=${{ vars.MODEL_FAST_ID || 'au.anthropic.claude-haiku-4-5-20251001-v1:0' }}
          -c modelSmartId=${{ vars.MODEL_SMART_ID || 'au.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
          -c publicApiUrl=${{ vars.PUBLIC_API_URL }}
