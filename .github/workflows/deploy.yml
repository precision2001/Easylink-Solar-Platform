# Test, then deploy the AI platform and the phone agent to AWS Sydney.
# Runs when the release/aws branch is pushed (or by hand once this file is on the default branch).
#
# AWS side (done 22 Oct 2026): GitHub OIDC provider, role easylink-github-deploy (trusts only
# repo:precision2001/Easylink-Solar-Platform:environment:production; may only assume the CDK
# bootstrap roles), CDKToolkit bootstrap in ap-southeast-2. See docs/VOICE_AGENT.md.
name: Deploy

on:
  push:
    branches: [release/aws]
  workflow_dispatch:
    inputs:
      voice_tasks:
        description: "Phone agent tasks to run (0 until the LiveKit, Deepgram and egress secrets are filled in)"
        default: "0"
        required: true
      stacks:
        description: "Stacks"
        default: "EasyLinkAi EasyLinkVoice"
        required: true

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./voice-agent "pytest>=8" "pytest-asyncio>=0.24"
      - run: python -m pytest
        working-directory: voice-agent

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm   # builds the arm64 agent image natively
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Only this repo's production environment can assume it (OIDC trust), so the ARN isn't secret.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::193801312483:role/easylink-github-deploy' }}
          aws-region: ap-southeast-2
      - name: Deploy
        run: >
          npx cdk deploy ${{ inputs.stacks || 'EasyLinkAi EasyLinkVoice' }}
          --require-approval never
          -c voiceTasks=${{ inputs.voice_tasks || vars.VOICE_TASKS || '0' }}
          -c backendApiBaseUrl=${{ vars.BACKEND_API_BASE_URL }}
          -c filesBucket=${{ vars.FILES_BUCKET }}
          -c modelFastId=${{ vars.MODEL_FAST_ID || 'au.anthropic.claude-haiku-4-5-20251001-v1:0' }}
          -c modelSmartId=${{ vars.MODEL_SMART_ID || 'au.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
          -c publicApiUrl=${{ vars.PUBLIC_API_URL }}
