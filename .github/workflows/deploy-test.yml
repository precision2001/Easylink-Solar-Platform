# Deploys this branch to the EasyLink test copy (test.easylinksolar.com.au).
# Never touches the live site. The AWS role only trusts this branch.
name: Deploy to test copy
on:
  push:
    branches: [test/website]
  workflow_dispatch:
concurrency: deploy-test-website
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: ap-southeast-2
  BUCKET: easylink-test-deploy-193801312483
  INSTANCE: i-0e4440f1b9a1bb16b
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::193801312483:role/easylink-github-test-deploy
          aws-region: ap-southeast-2
      - name: Upload code
        run: |
          KEY=builds/website-${GITHUB_SHA::7}.tgz
          git archive --format=tar.gz -o code.tgz HEAD
          aws s3 cp --only-show-errors code.tgz s3://$BUCKET/$KEY
          echo "KEY=$KEY" >> $GITHUB_ENV
      - name: Build and start on the test server
        run: |
          CID=$(aws ssm send-command --instance-ids $INSTANCE --document-name AWS-RunShellScript \
            --comment "deploy website ${GITHUB_SHA::7}" --timeout-seconds 600 \
            --parameters "{\"commands\":[\"/srv/easylink/bin/deploy.sh website $KEY\"],\"executionTimeout\":[\"2400\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command $CID"
          for i in $(seq 1 160); do
            sleep 15
            S=$(aws ssm get-command-invocation --command-id $CID --instance-id $INSTANCE --query Status --output text 2>/dev/null || echo Pending)
            case $S in Success|Failed|Cancelled|TimedOut) break;; esac
          done
          aws ssm get-command-invocation --command-id $CID --instance-id $INSTANCE --query StandardOutputContent --output text | tail -40
          aws ssm get-command-invocation --command-id $CID --instance-id $INSTANCE --query StandardErrorContent --output text | tail -40
          echo "Status: $S"
          [ "$S" = Success ]
